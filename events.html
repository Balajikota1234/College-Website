<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Balaji Educational Institutions</title>
    <link rel="stylesheet" href="events.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="./Images/Favicon.png">
</head>
<body>

    <div id="header"></div>
    
    <!-- Events Header Section -->
    <section class="events-header">
        <div class="header-overlay">
            <h2>Events</h2>
            <h6>Memories That Last Forever</h6>
        </div>
    </section>

    <!-- Search and Filter Section -->
    <div class="container">
        <div class="search-filter-section slide-up">
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="text" id="eventSearch" placeholder="Search events...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Events</button>
                <button class="filter-btn" data-filter="2025">2025</button>
                <button class="filter-btn" data-filter="2024">2024</button>
                <button class="filter-btn" data-filter="cultural">Cultural</button>
                <button class="filter-btn" data-filter="academic">Academic</button>
            </div>
        </div>

        <!-- Events Grid -->
        <div class="events-grid slide-up" id="eventsGrid">
            <!-- Events will be dynamically loaded here -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="no-results" style="display: none;">
            <i class="bi bi-emoji-frown"></i>
            <p>No events found matching your search.</p>
        </div>
    </div>

    <!-- Modal/Lightbox -->
    <div id="lightbox-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-section">
                    <h2 id="modal-title"></h2>
                    <p id="modal-date" class="modal-date"></p>
                    <p id="modal-description" class="modal-description"></p>
                </div>
                <button class="close-btn" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="photo-gallery" class="photo-gallery"></div>
            </div>
        </div>
    </div>

    <!-- Full Image Viewer -->
    <div id="image-viewer" class="image-viewer">
        <button class="close-viewer" aria-label="Close viewer">&times;</button>
        <button class="nav-btn prev-btn" aria-label="Previous image">&#8249;</button>
        <img id="viewer-image" src="" alt="Full size event photo">
        <button class="nav-btn next-btn" aria-label="Next image">&#8250;</button>
        
        <!-- Image Actions -->
        <div class="image-actions">
            <button class="action-btn download-btn" id="downloadBtn" aria-label="Download image">
                <i class="bi bi-download"></i>
            </button>
            <button class="action-btn share-btn" id="shareBtn" aria-label="Share image">
                <i class="bi bi-share"></i>
            </button>
            <span class="image-counter" id="imageCounter">1 / 15</span>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="share-modal">
        <div class="share-content">
            <h3>Share this image</h3>
            <div class="share-buttons">
                <button class="share-option" data-platform="facebook">
                    <i class="bi bi-facebook"></i> Facebook
                </button>
                <button class="share-option" data-platform="twitter">
                    <i class="bi bi-twitter"></i> Twitter
                </button>
                <button class="share-option" data-platform="whatsapp">
                    <i class="bi bi-whatsapp"></i> WhatsApp
                </button>
                <button class="share-option" data-platform="copy">
                    <i class="bi bi-link-45deg"></i> Copy Link
                </button>
            </div>
            <button class="close-share-btn">&times;</button>
        </div>
    </div>

    <div id="icons"></div>     
    <div id="footer"></div>

    <!-- Slide-up Animation Script -->
    <script>
        // Intersection Observer for slide-up animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        document.addEventListener('DOMContentLoaded', () => {
            const slideUpElements = document.querySelectorAll('.slide-up');
            slideUpElements.forEach(element => {
                observer.observe(element);
            });
        });
    </script>

    <script src="script.js"></script> 
    <script src="events.js"></script>
</body>
</html>
